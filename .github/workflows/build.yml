# Arma los instaladores para Mac (Apple Silicon e Intel) y Windows en las máquinas de GitHub.
# - Cada push: los archivos quedan en la pestaña Actions > la corrida > "Artifacts".
# - Si subís un tag tipo v0.5: además se publica un Release con los instaladores para descargar.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (M1, M2, M3…)
            arch: AppleSilicon
          - runner: macos-15-intel   # Macs con Intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -c "import tkinter; print('Tk', tkinter.Tcl().eval('info patchlevel'))"
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Prueba rápida del motor (sin ventana)
        run: |
          python - <<'EOF'
          import os, tempfile, pathlib
          import limpia_guarda as lg
          assert lg.IS_MAC
          rep = lg.analyze(str(pathlib.Path.home()), find_dups=False)
          print("analizado:", lg.human(rep.total), rep.n_files, "archivos,", rep.errors, "errores")
          print("temporales:", lg.default_temp_dirs())
          print("caches:", lg.default_cache_dirs())
          print("papelera:", lg.recycle_bin_info())
          print("disco:", lg.volume_of(str(pathlib.Path.home())))
          assert lg.is_protected("/") and lg.is_protected(str(pathlib.Path.home()))
          assert lg.is_protected("/System/Library") and lg.is_protected("/Applications")
          t = lg.default_temp_dirs()[0]
          assert not lg.is_protected(os.path.join(t, "algo")), "lo de adentro de TEMP se tiene que poder borrar"
          # copia verificada de ida y vuelta
          src, dst = tempfile.mkdtemp(), tempfile.mkdtemp()
          pathlib.Path(src, "a.txt").write_text("hola")
          pathlib.Path(src, ".DS_Store").write_text("x")
          st = lg.run_job([src], dst, lg.MODE_MOVE, __import__("threading").Event())
          assert st["errors"] == 0 and not os.path.exists(src), st
          print("vault ok")
          EOF

      - name: Prueba de tareas programadas (launchd)
        continue-on-error: true   # si falla, se ve como aviso pero el instalador se arma igual
        run: |
          python - <<'EOF'
          import limpia_guarda as lg, tempfile, time
          root = tempfile.mkdtemp()
          ok, msg = lg.schedule_task("limpieza", "cada domingo", "20:00", root, "")
          print("programar:", ok, msg)
          assert ok and lg.task_exists("limpieza")
          ok, msg = lg.run_task_now("limpieza")
          print("correr ahora:", ok, msg)
          assert ok
          for _ in range(60):
              if lg.AUTO_LOG.exists():
                  break
              time.sleep(1)
          print(lg.AUTO_LOG.read_text())
          ok, msg = lg.unschedule_task("limpieza")
          assert ok and not lg.task_exists("limpieza")
          print("launchd ok")
          EOF

      - name: Armar LimpiaGuarda.app
        run: python -m PyInstaller --noconfirm LimpiaGuarda-mac.spec

      - name: Probar la app armada
        run: |
          APP=dist/LimpiaGuarda.app/Contents/MacOS/LimpiaGuarda
          # modo programado (sin ventana) sobre una carpeta vacía
          "$APP" --preset limpieza --root "$(mktemp -d)" || echo "terminó con algún error (normal si había temporales en uso)"
          # abrir la ventana unos segundos y sacar una captura
          "$APP" & PID=$!
          sleep 15
          screencapture -x captura.png || true
          kill -0 $PID && echo "la ventana sigue abierta: ok"
          kill $PID || true

      - name: Armar el .dmg (arrastrar a Aplicaciones)
        run: |
          mkdir dmg
          cp -R dist/LimpiaGuarda.app dmg/
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Limpia&Guarda" -srcfolder dmg -ov -format UDZO "LimpiaGuarda-Mac-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: LimpiaGuarda-Mac-${{ matrix.arch }}
          path: |
            LimpiaGuarda-Mac-${{ matrix.arch }}.dmg
            captura.png
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Armar la app
        run: |
          python -m pip install pyinstaller tkinterdnd2
          python -m PyInstaller --noconfirm --windowed --name LimpiaGuarda --collect-all tkinterdnd2 --icon limpiateska.ico --add-data "limpiateska.ico;." limpia_guarda.py

      - name: Armar el instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path limpia_guarda.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyVersion=$version" instalador-windows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Probar el instalador
        shell: pwsh
        run: |
          Start-Process out\LimpiaGuarda-Windows-Instalador.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\LimpiaGuarda\LimpiaGuarda.exe"
          if (-not (Test-Path $exe)) { Write-Error "no se instaló en $exe"; exit 1 }
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Limpia*"
          Write-Host "instalado ok: $exe"

      - uses: actions/upload-artifact@v4
        with:
          name: LimpiaGuarda-Windows
          path: out/LimpiaGuarda-Windows-Instalador.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Preparar archivos
        run: |
          mkdir out
          cp LimpiaGuarda-Mac-*/LimpiaGuarda-Mac-*.dmg out/
          cp LimpiaGuarda-Windows/LimpiaGuarda-Windows-Instalador.exe out/
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: out/*
          body: |
            ## ⬇ Qué descargar

            | Tu computadora | Archivo |
            |---|---|
            | **Windows** | `LimpiaGuarda-Windows-Instalador.exe` |
            | **Mac con chip Apple** (M1, M2, M3, M4…) | `LimpiaGuarda-Mac-AppleSilicon.dmg` |
            | **Mac con Intel** | `LimpiaGuarda-Mac-Intel.dmg` |

            Los archivos están abajo, en **Assets**. Los de "Source code" son el código fuente: no hacen falta.

            ### Windows
            1. Abrí `LimpiaGuarda-Windows-Instalador.exe`.
            2. Si aparece **"Windows protegió su PC"**: tocá **Más información → Ejecutar de todas formas**. Aparece porque la app no tiene una firma digital paga.
            3. Seguí el instalador. Queda en el menú Inicio y, si querés, en el Escritorio. Se desinstala desde **Configuración → Aplicaciones**.

            ### Mac
            ¿Qué chip tengo?  → menú  → **Acerca de esta Mac**: dice "Chip Apple M…" o "Procesador Intel".
            1. Abrí el `.dmg` y arrastrá **LimpiaGuarda** a la carpeta **Aplicaciones**.
            2. Abrila desde Aplicaciones. La primera vez macOS la bloquea porque no está firmada por Apple: cerrá el aviso, andá a **Ajustes del Sistema → Privacidad y seguridad** y tocá **Abrir igualmente**.
            3. Recomendado: en **Privacidad y seguridad → Acceso total al disco**, agregá LimpiaGuarda.
